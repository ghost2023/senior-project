[project]
name = "satps-ml"
version = "0.1.0"
description = "SATPS predictive component: XGBoost + BiLSTM risk scoring with SHAP explanations, served over FastAPI. Read-only against the same Postgres the Next.js app writes to."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "pandas>=2.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "shap>=0.46",
    "sqlalchemy>=2.0.51",
    "tensorflow>=2.21.0",
    "uvicorn[standard]>=0.51.0",
    "xgboost>=3.3.0",
]
